<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potenciarte - Conexiones en Vivo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Production para mayor estabilidad UMD) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons (Versión Latest UMD) -->
    <script src="https://unpkg.com/lucide-react@0.462.0/dist/umd/lucide-react.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#F97316', // Tu color naranja
                            dark: '#1F2937',
                            purple: '#8B5CF6', // Un morado para contraste lúdico
                            pink: '#EC4899',   // Un rosa para acciones románticas
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'], // Fuente lúdica simulada
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 2',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos base y animaciones de tarjetas */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap');
        
        body { background-color: #f3f4f6; touch-action: manipulation; }
        
        .card-stack-container { position: relative; width: 100%; height: 100%; }
        
        .swipe-card {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 1.5rem;
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform-origin: 50% 100%;
            overflow: hidden;
        }

        .swipe-exit-left { transform: translateX(-150%) rotate(-20deg) !important; opacity: 0; }
        .swipe-exit-right { transform: translateX(150%) rotate(20deg) !important; opacity: 0; }

        /* Scroll oculto para UI limpia */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        
        // --- GESTIÓN ROBUSTA DE ICONOS ---
        // Intentamos cargar lucideReact (versión nueva) o lucide (versión antigua)
        // Si falla, usamos un Proxy para generar iconos "dummy" y que la app no explote.
        const LucideLibrary = window.lucideReact || window.lucide || new Proxy({}, {
            get: (target, prop) => {
                // Fallback component si el icono no existe
                return ({ size = 24, className = "", ...props }) => (
                    <span 
                        style={{ 
                            display: 'inline-block', 
                            width: size, 
                            height: size, 
                            fontSize: size * 0.8, 
                            lineHeight: 1, 
                            textAlign: 'center' 
                        }} 
                        className={className}
                        title={prop} // Muestra el nombre del icono al pasar el mouse
                        {...props}
                    >
                        {/* Mapeo simple de emojis para fallbacks visuales */}
                        {prop === 'Heart' ? '❤️' : 
                         prop === 'X' ? '❌' : 
                         prop === 'MessageCircle' ? '💬' : 
                         prop === 'User' ? '👤' : 
                         prop === 'Zap' ? '⚡' : 
                         prop === 'Sparkles' ? '✨' : '🔹'}
                    </span>
                );
            }
        });

        const { 
            Heart, X, MessageCircle, User, Settings, Shield, 
            Users, Zap, LogOut, Send, Camera, Sparkles, Megaphone,
            ArrowRight, MapPin, Coffee, Wine, PartyPopper
        } = LucideLibrary;

        // --- DATA MOCKUP & CONFIG ---

        // Generador de avatares caricatura
        const getAvatar = (seed) => `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}&backgroundColor=b6e3f4,c0aede,d1d4f9`;

        // Opciones de configuración
        const INTENTIONS = [
            { id: 'fun', label: 'Buena onda', icon: <Sparkles size={16} /> },
            { id: 'friend', label: 'Amistad', icon: <Coffee size={16} /> },
            { id: 'casual', label: 'Algo casual', icon: <Wine size={16} /> },
            { id: 'love', label: 'Felices x siempre', icon: <Heart size={16} /> },
        ];

        const IDENTITIES = ['Hombre', 'Mujer', 'No binario', 'Prefiero no decirlo'];
        const PREFERENCES = ['Hombres', 'Mujeres', 'Todos'];

        // Usuarios Iniciales (Base de datos simulada)
        const INITIAL_USERS = [
            { 
                id: 'u1', name: 'Admin User', email: 'admin@potenciarte.cl', isAdmin: true, 
                photo: getAvatar('admin'), bio: 'Gestor del evento', role: 'admin' 
            },
            { 
                id: 'u2', name: 'Sofía', email: 'sofia@demo.com', isAdmin: false,
                photo: getAvatar('Sofia'), bio: 'Amo el sushi y las caminatas largas.', 
                identity: 'Mujer', interestedIn: 'Hombres', intention: 'love', paid: true 
            },
            { 
                id: 'u3', name: 'Mateo', email: 'mateo@demo.com', isAdmin: false,
                photo: getAvatar('Mateo'), bio: 'Ingeniero de día, gamer de noche.', 
                identity: 'Hombre', interestedIn: 'Mujeres', intention: 'casual', paid: true 
            },
            { 
                id: 'u4', name: 'Valentina', email: 'vale@demo.com', isAdmin: false,
                photo: getAvatar('Valentina'), bio: 'Busco gente para ir a escalar.', 
                identity: 'Mujer', interestedIn: 'Todos', intention: 'friend', paid: true 
            },
            { 
                id: 'u5', name: 'Lucas', email: 'lucas@demo.com', isAdmin: false,
                photo: getAvatar('Lucas'), bio: 'Recién llegado a la ciudad.', 
                identity: 'Hombre', interestedIn: 'Mujeres', intention: 'fun', paid: true 
            },
            { 
                id: 'u6', name: 'Carla', email: 'carla@demo.com', isAdmin: false,
                photo: getAvatar('Carla'), bio: 'Fotógrafa amateur.', 
                identity: 'Mujer', interestedIn: 'Hombres', intention: 'love', paid: true 
            },
            { 
                id: 'u7', name: 'Alex', email: 'alex@demo.com', isAdmin: false,
                photo: getAvatar('Alex'), bio: 'Me río de mis propios chistes.', 
                identity: 'No binario', interestedIn: 'Todos', intention: 'fun', paid: true 
            }
        ];

        // --- COMPONENTES ---

        // 1. Banner de Anuncios (Global)
        const AnnouncementBanner = ({ message }) => {
            if (!message) return null;
            return (
                <div className="bg-gradient-to-r from-brand-purple to-brand-pink text-white p-3 shadow-lg animate-pulse-slow sticky top-0 z-50 flex items-center justify-center gap-2">
                    <Megaphone size={20} className="animate-bounce-short" />
                    <span className="font-bold text-sm md:text-base text-center">{message}</span>
                </div>
            );
        };

        // 2. Pantalla de Login
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            
            return (
                <div className="h-full flex flex-col items-center justify-center p-6 bg-brand-dark text-white relative overflow-hidden">
                    {/* Fondo decorativo */}
                    <div className="absolute top-[-10%] right-[-10%] w-64 h-64 bg-brand-orange rounded-full opacity-20 blur-3xl"></div>
                    <div className="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-brand-purple rounded-full opacity-20 blur-3xl"></div>

                    <div className="z-10 w-full max-w-sm text-center">
                        <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl mb-8 inline-block shadow-xl">
                            <Zap size={48} className="text-brand-orange mx-auto" />
                        </div>
                        <h1 className="text-4xl font-display font-bold mb-2">Potenciarte</h1>
                        <p className="text-gray-300 mb-8">Conecta, fluye y diviértete.</p>

                        <div className="space-y-4">
                            <input 
                                type="email" 
                                placeholder="Tu correo" 
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                className="w-full p-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange"
                            />
                            <button 
                                onClick={() => onLogin(email)}
                                className="w-full bg-brand-orange hover:bg-orange-600 text-white font-bold py-4 rounded-xl transition-all transform hover:scale-105 shadow-lg"
                            >
                                Ingresar al Evento
                            </button>
                        </div>
                        
                        <div className="mt-8 text-xs text-gray-500">
                            <p>Demo Users: sofia@demo.com, mateo@demo.com</p>
                            <p>Admin: admin@potenciarte.cl</p>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Pantalla de Pago
        const PaymentScreen = ({ onComplete }) => {
            const [loading, setLoading] = useState(false);

            const handlePay = () => {
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    onComplete();
                }, 1500);
            };

            return (
                <div className="h-full flex flex-col p-6 bg-white text-brand-dark items-center justify-center">
                    <div className="w-full max-w-sm text-center">
                        <div className="mb-6 relative inline-block">
                            <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=500&q=60" className="w-full h-48 object-cover rounded-2xl shadow-xl filter brightness-75" alt="Fiesta" />
                            <div className="absolute bottom-0 left-0 p-4 text-white text-left">
                                <h2 className="text-2xl font-bold">Evento Exclusivo</h2>
                                <p className="text-sm opacity-90">Acceso Total + App Matching</p>
                            </div>
                        </div>
                        
                        <div className="bg-gray-50 p-6 rounded-2xl border border-gray-100 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <span className="font-semibold">Entrada General</span>
                                <span className="text-xl font-bold text-brand-orange">$15.000</span>
                            </div>
                            <hr className="border-dashed border-gray-300 my-2" />
                            <ul className="text-left text-sm space-y-2 text-gray-600 mt-2">
                                <li className="flex items-center"><span className="text-green-500 mr-2">✓</span> Barra libre hasta las 12</li>
                                <li className="flex items-center"><span className="text-green-500 mr-2">✓</span> Acceso a "The Match Game"</li>
                            </ul>
                        </div>

                        <button 
                            onClick={handlePay}
                            disabled={loading}
                            className="w-full bg-brand-dark text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 disabled:opacity-70"
                        >
                            {loading ? 'Procesando...' : (
                                <>
                                    Pagar Entrada <ArrowRight size={18} />
                                </>
                            )}
                        </button>
                    </div>
                </div>
            );
        };

        // 4. Setup de Perfil (Data detallada)
        const ProfileSetup = ({ user, onSave }) => {
            const [formData, setFormData] = useState({
                name: user.name || '',
                identity: user.identity || 'Prefiero no decirlo',
                interestedIn: user.interestedIn || 'Todos',
                intention: user.intention || 'fun',
                bio: user.bio || '',
            });

            // Avatar pseudo-aleatorio basado en el nombre para la demo
            const previewAvatar = getAvatar(formData.name || 'newuser');

            return (
                <div className="h-full flex flex-col bg-gray-50 overflow-y-auto no-scrollbar">
                    <div className="p-6 pb-24">
                        <h2 className="text-2xl font-display font-bold text-brand-dark mb-1">Crea tu Perfil</h2>
                        <p className="text-gray-500 mb-6 text-sm">¡Así te verán los demás en la fiesta!</p>

                        <div className="flex justify-center mb-6">
                            <div className="relative w-32 h-32">
                                <img src={previewAvatar} alt="Avatar" className="w-32 h-32 rounded-full border-4 border-white shadow-md bg-blue-100" />
                                <div className="absolute bottom-0 right-0 bg-brand-orange p-2 rounded-full text-white shadow-sm">
                                    <Camera size={16} />
                                </div>
                            </div>
                        </div>

                        <div className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Tu Nombre</label>
                                <input 
                                    type="text" 
                                    value={formData.name} 
                                    onChange={e => setFormData({...formData, name: e.target.value})}
                                    className="w-full p-3 rounded-lg border border-gray-200 focus:border-brand-orange focus:ring-1 focus:ring-brand-orange outline-none"
                                    placeholder="Ej. Alex"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Me identifico como</label>
                                <div className="flex flex-wrap gap-2">
                                    {IDENTITIES.map(id => (
                                        <button
                                            key={id}
                                            onClick={() => setFormData({...formData, identity: id})}
                                            className={`px-3 py-2 text-sm rounded-lg border ${formData.identity === id ? 'bg-brand-dark text-white border-brand-dark' : 'bg-white text-gray-600 border-gray-200'}`}
                                        >
                                            {id}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Busco conectar con</label>
                                <div className="grid grid-cols-3 gap-2">
                                    {PREFERENCES.map(pref => (
                                        <button
                                            key={pref}
                                            onClick={() => setFormData({...formData, interestedIn: pref})}
                                            className={`px-3 py-2 text-sm rounded-lg border text-center ${formData.interestedIn === pref ? 'bg-brand-purple text-white border-brand-purple' : 'bg-white text-gray-600 border-gray-200'}`}
                                        >
                                            {pref}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-400 uppercase mb-1">¿Qué buscas hoy?</label>
                                <div className="grid grid-cols-2 gap-3">
                                    {INTENTIONS.map(intent => (
                                        <button
                                            key={intent.id}
                                            onClick={() => setFormData({...formData, intention: intent.id})}
                                            className={`p-3 rounded-xl border flex items-center gap-2 transition-all ${formData.intention === intent.id ? 'bg-orange-50 border-brand-orange ring-1 ring-brand-orange text-brand-orange' : 'bg-white border-gray-200 text-gray-600'}`}
                                        >
                                            <div className={formData.intention === intent.id ? 'text-brand-orange' : 'text-gray-400'}>
                                                {intent.icon}
                                            </div>
                                            <span className="text-sm font-medium">{intent.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Sobre ti (Breve)</label>
                                <textarea 
                                    value={formData.bio}
                                    onChange={e => setFormData({...formData, bio: e.target.value})}
                                    className="w-full p-3 rounded-lg border border-gray-200 focus:border-brand-orange outline-none h-24 resize-none"
                                    placeholder="Me gusta el cine, los perros y..."
                                    maxLength={100}
                                />
                                <p className="text-right text-xs text-gray-400">{formData.bio.length}/100</p>
                            </div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 max-w-md mx-auto">
                        <button 
                            onClick={() => onSave({...user, ...formData, photo: previewAvatar})}
                            className="w-full bg-brand-orange text-white font-bold py-3 rounded-xl shadow-lg"
                        >
                            ¡Listo para la fiesta!
                        </button>
                    </div>
                </div>
            );
        };

        // 5. Componente de Swipe (Tinder Style)
        const SwipeDeck = ({ profiles, onSwipe }) => {
            if (profiles.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center h-full text-center p-8 opacity-70">
                        <div className="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-4 animate-pulse">
                            <Users size={40} className="text-gray-400" />
                        </div>
                        <h3 className="text-xl font-bold text-brand-dark">¡No hay más perfiles!</h3>
                        <p className="text-sm text-gray-500 mt-2">Espera a que lleguen más invitados o amplía tus preferencias.</p>
                    </div>
                );
            }

            return (
                <div className="card-stack-container p-4">
                    {profiles.map((profile, index) => {
                        // Solo renderizar los 2 de arriba para performance
                        if (index > 1) return null;
                        
                        const isTop = index === 0;
                        return (
                            <div 
                                key={profile.id}
                                className={`swipe-card flex flex-col ${!isTop && 'scale-95 opacity-50 translate-y-4 z-0'} ${isTop && 'z-10 cursor-grab active:cursor-grabbing'}`}
                            >
                                {/* Imagen */}
                                <div className="relative h-3/5 bg-blue-50 flex items-center justify-center">
                                    <img src={profile.photo} alt={profile.name} className="w-full h-full object-contain p-4" />
                                    <div className="absolute top-4 left-4 bg-white/80 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-brand-purple shadow-sm">
                                        {INTENTIONS.find(i => i.id === profile.intention)?.label}
                                    </div>
                                </div>

                                {/* Info */}
                                <div className="h-2/5 p-5 flex flex-col justify-between bg-white">
                                    <div>
                                        <h2 className="text-2xl font-display font-bold text-brand-dark">{profile.name}</h2>
                                        <p className="text-brand-orange text-sm font-medium mb-2">{profile.identity}</p>
                                        <p className="text-gray-600 text-sm leading-relaxed">"{profile.bio}"</p>
                                    </div>
                                    
                                    {/* Controles solo visibles en la tarjeta superior */}
                                    {isTop && (
                                        <div className="flex justify-center gap-6 mt-2">
                                            <button 
                                                onClick={() => onSwipe('left', profile)}
                                                className="w-14 h-14 bg-white border-2 border-gray-200 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:border-red-500 transition-colors shadow-md"
                                            >
                                                <X size={28} />
                                            </button>
                                            <button 
                                                onClick={() => onSwipe('right', profile)}
                                                className="w-14 h-14 bg-gradient-to-tr from-brand-orange to-pink-500 rounded-full flex items-center justify-center text-white shadow-lg transform hover:scale-110 transition-transform"
                                            >
                                                <Heart size={28} fill="white" />
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // 6. Panel de Administrador
        const AdminDashboard = ({ users, totalMatches, onPostAnnouncement, activeAnnouncement, onLogout }) => {
            const [msg, setMsg] = useState('');
            const paidUsers = users.filter(u => u.paid && !u.isAdmin).length;
            const registeredProfiles = users.filter(u => u.bio && !u.isAdmin).length;

            return (
                <div className="h-full flex flex-col bg-gray-100">
                    <div className="bg-brand-dark text-white p-6 rounded-b-3xl shadow-lg z-10">
                        <div className="flex justify-between items-center mb-4">
                            <h1 className="text-2xl font-display font-bold">Admin Panel</h1>
                            <button onClick={onLogout} className="text-gray-400 hover:text-white"><LogOut size={20}/></button>
                        </div>
                        <div className="grid grid-cols-3 gap-4">
                            <div className="bg-white/10 p-3 rounded-xl text-center">
                                <div className="text-2xl font-bold text-brand-orange">{paidUsers}</div>
                                <div className="text-xs text-gray-300">Entradas</div>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl text-center">
                                <div className="text-2xl font-bold text-green-400">{registeredProfiles}</div>
                                <div className="text-xs text-gray-300">Perfiles</div>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl text-center">
                                <div className="text-2xl font-bold text-pink-400">{totalMatches}</div>
                                <div className="text-xs text-gray-300">Matches</div>
                            </div>
                        </div>
                    </div>

                    <div className="p-6 flex-grow overflow-y-auto">
                        <div className="bg-white p-5 rounded-xl shadow-sm mb-6">
                            <h3 className="font-bold text-brand-dark mb-3 flex items-center gap-2">
                                <Megaphone size={18} className="text-brand-purple" /> Publicar Anuncio
                            </h3>
                            <div className="space-y-3">
                                <textarea
                                    value={msg}
                                    onChange={e => setMsg(e.target.value)}
                                    className="w-full p-3 bg-gray-50 rounded-lg border text-sm"
                                    placeholder="Ej: ¡2x1 en la barra por 15 minutos!"
                                    rows="2"
                                />
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => { onPostAnnouncement(msg); setMsg(''); }}
                                        className="flex-1 bg-brand-purple text-white py-2 rounded-lg text-sm font-bold shadow-md hover:bg-purple-700"
                                    >
                                        Publicar
                                    </button>
                                    <button 
                                        onClick={() => onPostAnnouncement(null)}
                                        className="px-4 bg-gray-200 text-gray-600 rounded-lg text-sm font-bold"
                                    >
                                        Borrar
                                    </button>
                                </div>
                                {activeAnnouncement && (
                                    <p className="text-xs text-green-600 mt-2">Activo: "{activeAnnouncement}"</p>
                                )}
                            </div>
                        </div>

                        <h3 className="font-bold text-gray-500 text-sm uppercase mb-3">Asistentes Recientes</h3>
                        <div className="space-y-2">
                            {users.filter(u => !u.isAdmin).map(u => (
                                <div key={u.id} className="flex items-center bg-white p-3 rounded-lg shadow-sm">
                                    <img src={u.photo || getAvatar('placeholder')} className="w-8 h-8 rounded-full mr-3 bg-gray-100" />
                                    <div className="flex-1">
                                        <div className="font-bold text-sm text-brand-dark">{u.name || u.email}</div>
                                        <div className="text-xs text-gray-400">
                                            {u.paid ? (u.bio ? 'Perfil Activo' : 'Pagado (Sin perfil)') : 'Pendiente'}
                                        </div>
                                    </div>
                                    {u.paid && <span className="w-2 h-2 bg-green-500 rounded-full"></span>}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 7. Componente de Chats
        const ChatList = ({ matches, onOpenChat }) => {
            if (matches.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center h-full text-center p-8">
                        <div className="bg-white p-4 rounded-full mb-4 shadow-sm">
                            <MessageCircle size={32} className="text-gray-300" />
                        </div>
                        <p className="text-gray-500">Aún no tienes chats.</p>
                        <p className="text-xs text-gray-400 mt-1">¡Haz swipe para conectar!</p>
                    </div>
                );
            }
            return (
                <div className="p-4 space-y-2">
                    <h2 className="text-xl font-display font-bold mb-4 text-brand-dark">Tus Conexiones</h2>
                    {matches.map(match => (
                        <div 
                            key={match.id} 
                            onClick={() => onOpenChat(match)}
                            className="flex items-center p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow cursor-pointer"
                        >
                            <div className="relative">
                                <img src={match.photo} className="w-12 h-12 rounded-full bg-gray-100 object-cover" />
                                <span className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                            </div>
                            <div className="ml-3 flex-1">
                                <h3 className="font-bold text-brand-dark">{match.name}</h3>
                                <p className="text-xs text-gray-500 truncate">¡Han hecho match! Di hola 👋</p>
                            </div>
                            <ArrowRight size={16} className="text-gray-300" />
                        </div>
                    ))}
                    <div className="mt-8 p-4 bg-orange-50 rounded-lg text-center">
                        <p className="text-xs text-orange-600 flex items-center justify-center gap-1">
                            <Shield size={12} /> Los chats se borrarán al final del evento.
                        </p>
                    </div>
                </div>
            );
        };

        // 8. Vista de Chat Individual
        const ActiveChat = ({ match, onClose, myId }) => {
            const [text, setText] = useState('');
            // Mensajes mockeados que se resetean al recargar, idealmente irían en estado global
            const [msgs, setMsgs] = useState([
                { sender: 'system', text: `¡Es un match con ${match.name}! Ambos buscan "${INTENTIONS.find(i => i.id === match.intention)?.label}".` }
            ]);

            const handleSend = (e) => {
                e.preventDefault();
                if(!text.trim()) return;
                setMsgs([...msgs, { sender: myId, text }]);
                setText('');
                // Simular respuesta
                setTimeout(() => {
                    setMsgs(prev => [...prev, { sender: match.id, text: '¡Hola! ¿Qué tal la fiesta? 😊' }]);
                }, 2000);
            };

            return (
                <div className="flex flex-col h-full bg-white">
                    <div className="p-4 border-b flex items-center bg-white shadow-sm z-10">
                        <button onClick={onClose} className="mr-3 text-gray-500"><ArrowRight className="rotate-180" /></button>
                        <img src={match.photo} className="w-10 h-10 rounded-full bg-gray-100" />
                        <div className="ml-3">
                            <h3 className="font-bold text-brand-dark text-sm">{match.name}</h3>
                            <span className="text-xs text-green-500 font-medium">En línea en la fiesta</span>
                        </div>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
                        {msgs.map((m, i) => (
                            <div key={i} className={`flex ${m.sender === myId ? 'justify-end' : (m.sender === 'system' ? 'justify-center' : 'justify-start')}`}>
                                {m.sender === 'system' ? (
                                    <span className="text-xs bg-gray-200 text-gray-500 px-2 py-1 rounded-full">{m.text}</span>
                                ) : (
                                    <div className={`max-w-[75%] px-4 py-2 rounded-2xl text-sm shadow-sm ${m.sender === myId ? 'bg-brand-orange text-white rounded-br-sm' : 'bg-white text-gray-800 rounded-bl-sm border'}`}>
                                        {m.text}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    <form onSubmit={handleSend} className="p-3 border-t flex gap-2 bg-white">
                        <input 
                            className="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-orange"
                            placeholder="Escribe un mensaje..."
                            value={text}
                            onChange={e => setText(e.target.value)}
                        />
                        <button type="submit" className="bg-brand-orange text-white p-2 rounded-full shadow-md hover:bg-orange-600">
                            <Send size={18} />
                        </button>
                    </form>
                </div>
            );
        };

        // --- APP PRINCIPAL ---

        const App = () => {
            const [users, setUsers] = useState(INITIAL_USERS);
            const [currentUser, setCurrentUser] = useState(null);
            const [view, setView] = useState('login'); // login, payment, setup, app, admin
            const [tab, setTab] = useState('swipe'); // swipe, chats, profile
            const [matches, setMatches] = useState([]);
            const [announcement, setAnnouncement] = useState('');
            const [activeChatUser, setActiveChatUser] = useState(null);
            const [showMatchPopup, setShowMatchPopup] = useState(null); // Stores user object if matched

            // Filtrar perfiles para el stack
            const profileStack = useMemo(() => {
                if (!currentUser) return [];
                return users.filter(u => {
                    if (u.id === currentUser.id) return false; // No yo mismo
                    if (u.isAdmin) return false; // No admins
                    if (!u.paid || !u.bio) return false; // Solo perfiles completos
                    
                    // Lógica de género
                    const genderMatch = currentUser.interestedIn === 'Todos' || currentUser.interestedIn + 's' === u.identity + 's' || (currentUser.interestedIn === 'Hombres' && u.identity === 'Hombre') || (currentUser.interestedIn === 'Mujeres' && u.identity === 'Mujer');
                    
                    // Lógica inversa (yo debo gustarle a ellos también según sus prefs)
                    const reverseMatch = u.interestedIn === 'Todos' || (u.interestedIn === 'Hombres' && currentUser.identity === 'Hombre') || (u.interestedIn === 'Mujeres' && currentUser.identity === 'Mujer');

                    // No mostrar si ya hice match (en una app real guardariamos dislikes también)
                    const alreadyMatched = matches.find(m => m.id === u.id);

                    return genderMatch && reverseMatch && !alreadyMatched;
                });
            }, [users, currentUser, matches]);

            const handleLogin = (email) => {
                const existing = users.find(u => u.email === email);
                if (existing) {
                    setCurrentUser(existing);
                    if (existing.role === 'admin') {
                        setView('admin');
                    } else if (!existing.paid) {
                        setView('payment');
                    } else if (!existing.bio) {
                        setView('setup');
                    } else {
                        setView('app');
                    }
                } else {
                    // Crear usuario temporal nuevo
                    const newUser = { 
                        id: `u${Date.now()}`, 
                        email, 
                        paid: false, 
                        name: '', 
                        isAdmin: false,
                        role: 'user' 
                    };
                    setUsers([...users, newUser]);
                    setCurrentUser(newUser);
                    setView('payment');
                }
            };

            const handlePaymentComplete = () => {
                const updated = { ...currentUser, paid: true };
                setCurrentUser(updated);
                setUsers(users.map(u => u.id === currentUser.id ? updated : u));
                setView('setup');
            };

            const handleProfileSave = (fullProfile) => {
                setCurrentUser(fullProfile);
                setUsers(users.map(u => u.id === currentUser.id ? fullProfile : u));
                setView('app');
            };

            const handleSwipe = (dir, profile) => {
                if (dir === 'right') {
                    // Simular match instantáneo para demo (50% prob) o si es un usuario específico
                    const isMatch = Math.random() > 0.5; 
                    
                    if (isMatch) {
                        setMatches([...matches, profile]);
                        setShowMatchPopup(profile);
                    }
                }
                // Remover visualmente se maneja en SwipeDeck, aquí actualizamos estado si fuera necesario persistir dislikes
            };

            // Modal de Match
            const MatchPopup = () => {
                if (!showMatchPopup) return null;
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-6 backdrop-blur-sm">
                        <div className="bg-white rounded-3xl p-6 text-center w-full max-w-sm animate-bounce-short">
                            <div className="flex justify-center -space-x-6 mb-4">
                                <img src={currentUser.photo} className="w-20 h-20 rounded-full border-4 border-white" />
                                <img src={showMatchPopup.photo} className="w-20 h-20 rounded-full border-4 border-white" />
                            </div>
                            <h2 className="text-4xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-brand-orange to-pink-500 mb-2">¡Es un Match!</h2>
                            <p className="text-gray-500 mb-6">A {showMatchPopup.name} también le interesas.</p>
                            
                            <button 
                                onClick={() => {
                                    setActiveChatUser(showMatchPopup);
                                    setTab('chats');
                                    setShowMatchPopup(null);
                                }}
                                className="w-full bg-brand-orange text-white font-bold py-3 rounded-xl mb-3 shadow-lg"
                            >
                                Enviar Mensaje
                            </button>
                            <button 
                                onClick={() => setShowMatchPopup(null)}
                                className="w-full text-gray-400 font-semibold py-2"
                            >
                                Seguir jugando
                            </button>
                        </div>
                    </div>
                );
            };

            // Renderizado Principal
            return (
                <div className="w-full h-screen bg-gray-200 flex justify-center items-center font-sans">
                    <div className="w-full max-w-md h-full md:h-[90vh] md:rounded-3xl bg-white shadow-2xl overflow-hidden relative flex flex-col">
                        
                        {/* Banner Global */}
                        {view !== 'login' && <AnnouncementBanner message={announcement} />}

                        {/* Rutas */}
                        {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                        {view === 'payment' && <PaymentScreen onComplete={handlePaymentComplete} />}
                        {view === 'setup' && <ProfileSetup user={currentUser} onSave={handleProfileSave} />}
                        
                        {view === 'admin' && (
                            <AdminDashboard 
                                users={users} 
                                totalMatches={matches.length * 2 + 54} // Fake data added to real
                                activeAnnouncement={announcement}
                                onPostAnnouncement={setAnnouncement} 
                                onLogout={() => { setView('login'); setCurrentUser(null); }}
                            />
                        )}

                        {view === 'app' && (
                            <>
                                {/* Header App */}
                                {activeChatUser ? null : (
                                    <header className="p-4 flex justify-between items-center bg-white">
                                        <div className="flex items-center gap-2">
                                            <div className="w-8 h-8 rounded-full bg-brand-orange flex items-center justify-center text-white">
                                                <Zap size={18} fill="currentColor" />
                                            </div>
                                            <span className="font-display font-bold text-xl text-brand-dark">Potenciarte</span>
                                        </div>
                                        <div className="w-8 h-8 rounded-full overflow-hidden border border-gray-200">
                                            <img src={currentUser?.photo} alt="Me" />
                                        </div>
                                    </header>
                                )}

                                {/* Contenido Principal */}
                                <main className="flex-1 overflow-hidden relative bg-gray-50">
                                    {activeChatUser ? (
                                        <ActiveChat 
                                            match={activeChatUser} 
                                            myId={currentUser.id} 
                                            onClose={() => setActiveChatUser(null)} 
                                        />
                                    ) : (
                                        <>
                                            {tab === 'swipe' && <SwipeDeck profiles={profileStack} onSwipe={handleSwipe} />}
                                            {tab === 'chats' && <ChatList matches={matches} onOpenChat={setActiveChatUser} />}
                                            {tab === 'profile' && (
                                                <div className="p-6 text-center">
                                                    <img src={currentUser.photo} className="w-32 h-32 mx-auto rounded-full mb-4 bg-blue-100" />
                                                    <h2 className="text-2xl font-bold text-brand-dark">{currentUser.name}</h2>
                                                    <p className="text-brand-orange mb-6 font-medium">{currentUser.job}</p>
                                                    <div className="bg-white p-4 rounded-xl shadow-sm text-left mb-4">
                                                        <h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Bio</h3>
                                                        <p className="text-gray-600">{currentUser.bio}</p>
                                                    </div>
                                                    <button onClick={() => setView('login')} className="text-red-400 font-bold text-sm mt-4 flex items-center justify-center gap-2 mx-auto">
                                                        <LogOut size={16}/> Cerrar Sesión
                                                    </button>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </main>

                                {/* Bottom Nav */}
                                {!activeChatUser && (
                                    <nav className="bg-white border-t border-gray-100 p-2 flex justify-around items-center pb-safe">
                                        <button 
                                            onClick={() => setTab('swipe')}
                                            className={`p-3 rounded-xl transition-all ${tab === 'swipe' ? 'text-brand-orange bg-orange-50' : 'text-gray-400'}`}
                                        >
                                            <Sparkles size={24} />
                                        </button>
                                        <button 
                                            onClick={() => setTab('chats')}
                                            className={`p-3 rounded-xl transition-all relative ${tab === 'chats' ? 'text-brand-purple bg-purple-50' : 'text-gray-400'}`}
                                        >
                                            <MessageCircle size={24} />
                                            {matches.length > 0 && <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>}
                                        </button>
                                        <button 
                                            onClick={() => setTab('profile')}
                                            className={`p-3 rounded-xl transition-all ${tab === 'profile' ? 'text-gray-800 bg-gray-100' : 'text-gray-400'}`}
                                        >
                                            <User size={24} />
                                        </button>
                                    </nav>
                                )}

                                {/* Popups */}
                                <MatchPopup />
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
